      description: Optional record of the seller's decision about a price suggestion for this listing.
        Stored with the suggestion in the same transaction as the save; the listing price stays the
        seller's salePrice. Rejected with 422 at /priceAssist/suggestionId when the suggestion is
        unknown, foreign, not Suggested, expired, or was made for another book, condition or
        condition answers than the content being saved.
      required:
        - suggestionId
        - applied
