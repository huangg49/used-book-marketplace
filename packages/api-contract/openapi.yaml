        - Listings
      summary: listPublicListings
      description: Eligible public projection only. No-store. Full eligibility is evaluated in one
        database snapshot per page, with no cross-page snapshot guarantee.
      x-implementation-status: implemented
      security: []
      parameters:
        - in: query
          name: categoryId
          required: false
          schema:
            $ref: "#/components/schemas/CatalogCategoryId"
          description: Includes descendants. Legacy known category labels resolve read-only; unknown legacy
            categories remain unclassified.
        - in: query
          name: language
          required: false
          schema:
            type: string
            pattern: ^[a-z]{2,3}$
            maxLength: 3
          description: Primary language of the edition, not the language being learned.
        - in: query
          name: series
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description: Exact series name, Unicode-normalized and case-insensitive.
        - in: query
          name: facets
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 4096
          description: JSON CatalogAttributes object. Requires categoryId for nonempty values. OR within a
            facet; AND between facets. Parent categories accept compatible descendant contexts. Unknown/inapplicable values or incompatible grade/level return 422.
            Normalized selections bind the cursor.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          description: "Opaque base64url keyset cursor bound to normalized filters, sort and caller scope.
            Invalid/mismatched cursor: 400. No snapshot guarantee. All pages recheck eligibility."
        - in: query
          name: q
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Trim; case/accent-insensitive title/author substring; ISBN canonical equality. Escape
            LIKE wildcards as literal text.
        - in: query
          name: bookId
          required: false
          schema:
            type: string
            format: uuid
        - in: query
          name: mode
          required: false
          schema:
            $ref: "#/components/schemas/ListingMode"
          description: Sale or Exchange includes Both. Both means Both only.
        - in: query
          name: condition
          required: false
          schema:
            $ref: "#/components/schemas/BookCondition"
        - in: query
          name: minSalePrice
          required: false
          schema:
            type: integer
            minimum: 10000
            maximum: 1000000
        - in: query
          name: maxSalePrice
          required: false
          schema:
            type: integer
            minimum: 10000
            maximum: 1000000
        - in: query
          name: minExchangeValue
          required: false
          schema:
            type: integer
            minimum: 10000
            maximum: 1000000
        - in: query
          name: maxExchangeValue
          required: false
          schema:
            type: integer
            minimum: 10000
            maximum: 1000000
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum:
              - newest
              - salePriceAsc
              - salePriceDesc
              - exchangeValueAsc
              - exchangeValueDesc
            default: newest
          description: "Price sort/filter excludes null values. Newest: publishedAt,id DESC; price: value then
            id in same direction. min > max: 422. Combined filters AND."
      responses:
        "200":
          description: Successful read.
          headers:
            Cache-Control:
              schema:
