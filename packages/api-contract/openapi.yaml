        with AwaitingPayment until payment commits, then InTransaction. Unpaid reservations expose only
        their payment deadline, never participant identities. InNegotiation is retained for legacy
        conversation reservations. No new checkout or conversation can start until Available.
        Never serialize a private listing then filter on the client.
