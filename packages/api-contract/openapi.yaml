openapi: 3.1.0
info:
  title: Lật lại API
  version: 0.45.0
  description: "Auth/profile, catalog, owner drafts/media, listing submission/moderation and eligible
    public shelf/detail/media and approved editing/visibility/archive/removal commands are
    implemented. Participant agreement workspaces with mutually confirmed mode/price proposals and linked Exchange history are implemented. Member private address book and versioned demo service-area directory are
    implemented. Revision-bound delivery origins and private DirectDelivery sale estimates are
    implemented. Quotes do not reserve books. Unpaid DirectDelivery Order create/read/cancel and
    internal expiry with exclusive commitments are implemented. Simulated wallet ledger, private
    topup/history and TEST_OPERATOR payment events are implemented. LOCKED access covers profile,
    participant Order reads/media/unpaid cancellation/paid refund requests and private wallet/topup
    history; other authenticated operations deny LOCKED by default. New payment remains denied for
    LOCKED accounts. Order wallet funding, pre-confirmation cancellation/rejection, deadline and
    durable full refund workers are implemented. Seller acceptance, fixed pickup deadline and
    durable overdue verification tasks are implemented. Case resolution, sale settlement, withdrawal
    and checkout/wallet UI remain planned. Private Order packaging image intents, bounded verified
    binary uploads and audited participant previews are implemented. Packaging evidence does not
    prove pickup or authenticity. DirectDelivery outbound shipment registration and private
    participant reads are implemented; LabelCreated never proves carrier pickup. Authenticated
    independent TEST_OPERATOR pickup simulation is implemented: timely pickup moves Order InTransit,
    late/conflicting evidence opens sticky carrier review without moving money or stock. Delivery,
    resolution and settlement remain planned. Delivery overdue worker and Buyer non-receipt
    reporting after the pinned delivery deadline are implemented. They open or supplement a durable
    delivery review and retain full Order hold/commitment. Delivered, inspection, dispute
    adjudication and settlement remain planned. Owner-only advisory sale-price suggestions from
    sourced price references are implemented behind a server flag; they never set or verify a
    price. Bounded auctions (ADR 0030) are implemented from Sale intake at two simulated HCM points
    through Staff receipt/inspection, proxy bidding with private Auto ceilings, Buy Now before the
    first bid and server-time close. A win or Buy Now forms a ViaPoint Order that the buyer pays
    from the simulated wallet into an Order hold; unpaid Orders expire to reclaim. The buyer then
    accepts or rejects the point condition report, requests a one-time collection code and
    assigned Staff record the handover, which starts the 72-hour inspection window. Rejected or
    overdue Orders wait for an independent Admin to refund the hold or reopen collection. During
    the inspection window the buyer may file one claim; an Admin dismisses it or requires the book
    back, and the Staff-received return refunds the hold. Unclaimed Orders settle after the window
    (seller P - C, platform C) and the listing becomes Sold."
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: System
  - name: Auth
  - name: Catalog
  - name: Catalog review
  - name: Listings
  - name: Listing review
  - name: Media
  - name: Addresses
  - name: Quotes
  - name: Orders
  - name: Wallet
  - name: User administration
  - name: Wishlist
  - name: Auctions
  - name: Reviews
paths:
  /health:
    get:
      operationId: getHealth
      tags:
        - System
      responses:
        "200":
          description: Process is running. Does not check dependencies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /health/ready:
    get:
      operationId: getReadiness
      tags:
        - System
      responses:
        "200":
          description: Database is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [Auth]
      description: Normalized unique email; creates only an unverified MEMBER. Existing accounts receive the same acknowledgement and are never overwritten. Password 10..128 characters. Simulation rules acknowledgement required. Verification link valid 30 minutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Request accepted without revealing account existence. Email delivery is asynchronous.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRequestAcknowledgement"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/verification/resend:
    post:
      operationId: resendEmailVerification
      tags: [Auth]
      description: Generic acknowledgement for all email addresses. Only unverified accounts receive mail. Minimum 60 seconds between links; issuing a new link invalidates all previous verification links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEmailRequest"
      responses:
        "202":
          description: Request accepted without revealing account existence. Email delivery is asynchronous.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRequestAcknowledgement"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/verify-email:
    post:
      operationId: verifyEmail
      tags: [Auth]
      description: Consume an unexpired single-use verification token and activate the account atomically. No session is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthActionTokenRequest"
      responses:
        "204":
          description: Completed. The link cannot be used again.
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [Auth]
      description: Identical acknowledgement for existing and unknown accounts. Single-use reset link valid 15 minutes. Minimum 60 seconds between links.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountEmailRequest"
      responses:
        "202":
          description: Request accepted without revealing account existence. Email delivery is asynchronous.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountRequestAcknowledgement"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [Auth]
      description: Consume a reset token once, replace the password and revoke all sessions atomically. Does not change status or grant roles. No automatic login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          description: Completed. The link cannot be used again.
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/otp/register:
    post:
      operationId: registerAccountWithOtp
      tags: [Auth]
      description: Creates only an unverified MEMBER. Generic challenge acknowledgement for duplicates; credentials never overwritten. Six-digit verification code valid 5 minutes, five wrong attempts, 60-second resend cooldown. No session created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "202":
          description: Generic challenge; eligible accounts receive asynchronous email. Opaque challenge ID is not proof of account existence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOtpAcknowledgement"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/otp/request:
    post:
      operationId: requestAccountOtp
      tags: [Auth]
      description: Generic response for unknown, ineligible and cooldown requests. Eligible accounts receive a new code, invalidating prior codes and links of the same purpose. Cooldown requests never expose or invalidate the active challenge. Five-minute expiry and 60-second cooldown enforced by server time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountOtpRequest"
      responses:
        "202":
          description: Generic asynchronous acknowledgement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountOtpAcknowledgement"
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/otp/verify-email:
    post:
      operationId: verifyEmailWithOtp
      tags: [Auth]
      description: Atomically consume the challenge and activate an unverified account. Five failed code attempts lock that challenge; parallel requests cannot exceed the budget. No automatic login. OTP_INVALID or OTP_ATTEMPTS_EXCEEDED on failure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountOtpCodeRequest"
      responses:
        "204":
          description: Email verified; challenge cannot be reused.
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/otp/reset-password:
    post:
      operationId: resetPasswordWithOtp
      tags: [Auth]
      description: Atomically consume the reset challenge, replace password and revoke every session. Existing status and roles retained. No automatic login. Same five-attempt budget and OTP error codes as verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountOtpResetRequest"
      responses:
        "204":
          description: Password changed and sessions revoked.
        "400":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      tags:
        - Auth
      description: Sign in with a verified, active or restricted account. Limited to 5 attempts per
        account and IP per fixed 15-minute window. Verified LOCKED users may
        authenticate/rotate/read profile for existing obligations; protected routes remain
        deny-by-default for LOCKED. Status and roles are rechecked from DB.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created. Keep the refresh token in secure device storage.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      operationId: refreshSession
      tags:
        - Auth
      description: Rotate the refresh token once. Concurrent reuse has one winner. Session expiry is
        absolute. Verified LOCKED users may authenticate/rotate/read profile for existing
        obligations; protected routes remain deny-by-default for LOCKED. Status and roles are
        rechecked from DB.
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "200":
          description: Persist the replacement refresh token before continuing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      tags:
        - Auth
      description: Revoke using the current refresh token, even when access has expired. Repeated requests
        are harmless.
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "204":
          description: Session revoked or token already invalid.
        "400":
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags:
        - Auth
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User and roles read from the database on each request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Error"
      description: " Verified LOCKED users may authenticate/rotate/read profile for existing obligations;
        protected routes remain deny-by-default for LOCKED. Status and roles are rechecked from DB."
      x-locked-access: profile
  /catalog/taxonomy:
    get:
      operationId: getCatalogTaxonomy
      tags: [Catalog]
      summary: Versioned category tree and contextual vocabulary
      security: []
      x-implementation-status: implemented
      responses:
        '200':
          description: Shared controlled classification vocabulary; no inventory counts.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                type: object
                required: [version, categories, facets, languages]
                properties:
                  version: { type: string }
                  categories:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogCategory' }
                  facets:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogFacet' }
                  languages:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogOption' }
  /catalog/books:
    get:
      operationId: listBooks
      tags:
        - Catalog
      summary: listBooks
      description: Confirmed catalog only, ordered by normalized title then id ASC. No private catalog
        request metadata.
      x-implementation-status: implemented
      security: []
      parameters:
        - in: query
          name: categoryId
          required: false
          schema:
            $ref: "#/components/schemas/CatalogCategoryId"
          description: Includes descendants. Legacy known category labels resolve read-only; unknown legacy
            categories remain unclassified.
        - in: query
          name: language
          required: false
          schema:
            type: string
            pattern: ^[a-z]{2,3}$
            maxLength: 3
          description: Primary language of the edition, not the language being learned.
        - in: query
          name: series
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description: Exact series name, Unicode-normalized and case-insensitive.
        - in: query
          name: facets
          required: false
          schema:
            type: string
            minLength: 2
            maxLength: 4096
          description: JSON CatalogAttributes object. Requires categoryId for nonempty values. OR within a
            facet; AND between facets. Parent categories accept compatible descendant contexts. Unknown/inapplicable values or incompatible grade/level return 422.
            Normalized selections bind the cursor.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          description: "Opaque signed keyset cursor bound to normalized filters and caller scope. Malformed,
            modified or mismatched cursor: 400. No snapshot guarantee. Every page rechecks
            authorization."
        - in: query
          name: q
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: Trim; case/accent-insensitive title/author substring; ISBN canonical equality. Escape
            LIKE wildcards as literal text.
      responses:
        "200":
          description: Successful read.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookPage"
        "400":
          $ref: "#/components/responses/ListingError"
        "404":
          $ref: "#/components/responses/ListingError"
        "409":
          $ref: "#/components/responses/ListingError"
        "422":
          $ref: "#/components/responses/ListingError"
        "429":
          $ref: "#/components/responses/ListingError"
        "500":
          $ref: "#/components/responses/ListingError"
        "503":
          $ref: "#/components/responses/ListingError"
  /catalog/books/{bookId}:
    get:
      operationId: getBook
      tags:
        - Catalog
      summary: getBook
      description: Confirmed only; otherwise 404. Related listings use GET /listings?bookId=... .
      x-implementation-status: implemented
      security: []
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful read.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicBook"
        "400":
          $ref: "#/components/responses/ListingError"
        "404":
          $ref: "#/components/responses/ListingError"
        "409":
          $ref: "#/components/responses/ListingError"
        "422":
          $ref: "#/components/responses/ListingError"
        "429":
          $ref: "#/components/responses/ListingError"
        "500":
          $ref: "#/components/responses/ListingError"
        "503":
          $ref: "#/components/responses/ListingError"
  /catalog/requests:
    post:
      operationId: createCatalogRequest
      tags:
        - Catalog
      summary: createCatalogRequest
      description: Verified ACTIVE MEMBER. Creates Pending book + immutable request revision. ISBN
        collision with Confirmed returns 409 CatalogDuplicate (client queries public ISBN). Never
        disclose another private request.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
          description: "One key per intent; scoped by actor and operationId. Fingerprint includes method, path
            IDs and canonical body. Different payload with same key: 409. Required for all domain
            mutations."
      responses:
        "200":
          description: Committed receipt (including replay).
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              schema:
                type: boolean
              description: true only for a previously committed command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ListingError"
        "401":
          $ref: "#/components/responses/ListingError"
        "403":
          $ref: "#/components/responses/ListingError"
        "404":
          $ref: "#/components/responses/ListingError"
        "409":
          $ref: "#/components/responses/ListingError"
        "422":
          $ref: "#/components/responses/ListingError"
        "429":
          $ref: "#/components/responses/ListingError"
        "500":
          $ref: "#/components/responses/ListingError"
        "503":
          $ref: "#/components/responses/ListingError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCatalogRequest"
  /me/catalog-requests:
    get:
      operationId: listMyCatalogRequests
      tags:
        - Catalog
      summary: listMyCatalogRequests
      description: Requester only, ACTIVE/RESTRICTED session. updatedAt,id DESC.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          description: "Opaque signed keyset cursor bound to normalized filters and caller scope. Malformed,
            modified or mismatched cursor: 400. No snapshot guarantee. Every page rechecks
            authorization."
      responses:
        "200":
          description: Successful read.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRequestPage"
        "400":
          $ref: "#/components/responses/ListingError"
        "401":
          $ref: "#/components/responses/ListingError"
        "403":
          $ref: "#/components/responses/ListingError"
        "404":
          $ref: "#/components/responses/ListingError"
        "409":
          $ref: "#/components/responses/ListingError"
        "422":
          $ref: "#/components/responses/ListingError"
        "429":
          $ref: "#/components/responses/ListingError"
        "500":
          $ref: "#/components/responses/ListingError"
        "503":
          $ref: "#/components/responses/ListingError"
  /me/catalog-requests/{bookId}:
    get:
      operationId: getMyCatalogRequest
      tags:
        - Catalog
      summary: getMyCatalogRequest
      description: Requester only; unrelated ID 404.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful read.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrivateCatalogRequest"
        "400":
          $ref: "#/components/responses/ListingError"
        "401":
          $ref: "#/components/responses/ListingError"
        "403":
          $ref: "#/components/responses/ListingError"
        "404":
          $ref: "#/components/responses/ListingError"
        "409":
          $ref: "#/components/responses/ListingError"
        "422":
          $ref: "#/components/responses/ListingError"
        "429":
          $ref: "#/components/responses/ListingError"
        "500":
          $ref: "#/components/responses/ListingError"
        "503":
          $ref: "#/components/responses/ListingError"
  /catalog/requests/{bookId}/resubmit:
    post:
      operationId: resubmitCatalogRequest
      tags:
        - Catalog
      summary: resubmitCatalogRequest
      description: ACTIVE requester; Rejected only. New immutable revision, Pending; previous decisions
        preserved.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookId
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
            format: uuid
          description: "One key per intent; scoped by actor and operationId. Fingerprint includes method, path
            IDs and canonical body. Different payload with same key: 409. Required for all domain
            mutations."
      responses:
        "200":
          description: Committed receipt (including replay).
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Idempotency-Replayed:
              schema:
                type: boolean
              description: true only for a previously committed command.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ListingError"
        "401":
          $ref: "#/components/responses/ListingError"
        "403":
          $ref: "#/components/responses/ListingError"
        "404":
          $ref: "#/components/responses/ListingError"
        "409":
          $ref: "#/components/responses/ListingError"
        "422":
          $ref: "#/components/responses/ListingError"
        "429":
          $ref: "#/components/responses/ListingError"
        "500":
          $ref: "#/components/responses/ListingError"
        "503":
          $ref: "#/components/responses/ListingError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResubmitCatalogRequest"
  /operations/catalog-requests:
    get:
      operationId: listCatalogReviewQueue
      tags:
        - Catalog review
      summary: listCatalogReviewQueue
      description: ACTIVE ADMIN only; default Pending. createdAt,id ASC. No self-decision.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 2048
          description: "Opaque signed keyset cursor bound to normalized filters and caller scope. Malformed,
            modified or mismatched cursor: 400. No snapshot guarantee. Every page rechecks
            authorization."
        - in: query
          name: status
          required: false
          schema:
            $ref: "#/components/schemas/CatalogStatus"
      responses:
        "200":
          description: Successful read.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogRequestPage"
        "400":
          $ref: "#/components/responses/ListingError"
        "401":
          $ref: "#/components/responses/ListingError"
        "403":
          $ref: "#/components/responses/ListingError"
        "404":
