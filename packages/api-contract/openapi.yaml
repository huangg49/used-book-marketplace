  /listings/{listingId}/price-suggestions:
    post:
      operationId: requestPriceSuggestion
      tags:
        - Listings
      summary: requestPriceSuggestion
      description: "ACTIVE owner; Draft/Rejected, or Approved and Available (approved edit). Advisory sale-price
        range from sourced price references only; never a verified or reference price and never
        written to the listing. Input is the unsaved form; server checks the catalog book (confirmed,
        or the caller's own pending request). A listing with no Ready photo gets NeedsMoreData
        (R-NEED-PHOTO) without a model call. A book without a recent online price starts one
        background lookup; while it runs and no other source exists the answer is NeedsMoreData
        (R-LOOKUP-PENDING). Evidence level and refusal are decided by fixed rules;
        the model only drafts range/factors, which are checked against the evidence and POL-16.
        Same listing + input + reference set returns the stored suggestion (cached=true) without a
        new model call. Idempotency-Key is one per ask: a retry with the same key and body returns
        that request's suggestion (cached=true) or its stored failure (503); same key with another
        listing/body is 409 IdempotencyConflict. 429 per-user/per-listing limits or a request still
        running; 503 when the assistant is disabled, over budget, times out or returns invalid
        output. Clients keep manual pricing in every failure. No address, account, session or
        token data is sent to the provider."
      x-implementation-status: implemented
      security:
        - bearerAuth: []
