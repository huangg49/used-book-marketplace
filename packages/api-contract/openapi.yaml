      description: "ACTIVE ADMIN independent of buyer, seller and the Staff who received, inspected,
        handed over, took back or work at the point; a repeated claim needs an Admin who did not
        decide an earlier claim. Only for ResolutionPending. RecipientDecisionOverdue: RefundBuyer
        (BuyerDefault or NoFault). ReportRejected: RefundBuyer (BookMisdescribed or NoFault) or
        ResumeCollection when the rejection is unfounded. CollectionOverdue: RefundBuyer
        (BuyerDefault or NoFault) or ResumeCollection. RefundBuyer posts one OrderRefund of the full
        hold, cancels the Order and sends the book to reclaim (BookMisdescribed also sends the
        listing back to revision; BuyerDefault records a violation). ResumeCollection opens a new
        72-hour window in point hours without recording a buyer acceptance. After the handover
        (InspectionClaim, ReturnOverdue): DismissClaim back to Inspection, or RequireReturn within
        72 hours. Any other decision or fault returns 422. A reason is required and recorded."
