components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefreshRequest"
  responses:
    Error:
      description: Stable error code and request ID. No secrets or internal exceptions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    ListingError:
      description: Stable listing error; no internal exception text. 400 malformed input/cursor; 401
        UNAUTHORIZED; 403 FORBIDDEN/AccountIneligible/SelfReviewForbidden; 404 NOT_FOUND; 409
        VersionConflict/InvalidState/ListingLimitReached/IdempotencyConflict/CatalogDuplicate/CatalogNotConfirmed/UploadIncomplete/UploadExpired;
        422 ListingInvalid/MediaNotReady/VALIDATION_ERROR with safe fieldErrors; 413
        PayloadTooLarge; 415 UnsupportedMediaType; 429 RATE_LIMITED/MediaQuotaExceeded with
        retryAfterSeconds and Retry-After; 500 INTERNAL_ERROR; 503 UNAVAILABLE.
      headers:
        Retry-After:
          description: Present on 429; seconds until another attempt may be made.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ListingApiError"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - service
        - timestamp
