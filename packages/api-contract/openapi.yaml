      description: Authenticated bounded binary upload through NestJS to private Supabase Storage. Exact
        declared length, MIME and SHA-256 checked before storage. Idempotency-Key applies to
        acknowledgement; use the same key on retry. Same media ID can only accept its declared
        bytes. Returns Media receipt; refetch MEDIA version before finalize. Storage calls occur
        outside DB transactions and authorization is rechecked before acknowledgement. Upload-Token
        comes from getUploadTicket. 2 concurrent uploads/API process; maximum body 10MB and timeout
        120s.
      x-implementation-status: implemented
      security:
        - bearerAuth: []
      parameters:
        - in: path
