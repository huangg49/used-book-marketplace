      type: object
      additionalProperties: false
      required:
        - title
        - authors
        - publisher
        - publicationYear
        - language
        - edition
        - category
        - isbn
      properties:
        categoryId:
          anyOf:
            - $ref: "#/components/schemas/CatalogCategoryId"
            - type: "null"
          description: Stable taxonomy code. Optional for legacy clients; when supplied category must match
            its canonical label. Confirmed metadata stays immutable.
        attributes:
          $ref: "#/components/schemas/CatalogAttributes"
        series:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 120
            - type: "null"
          description: Series name as supplied and reviewed; not the volume or completion status.
        title:
          type: string
          minLength: 1
          maxLength: 300
        authors:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
          maxItems: 10
        publisher:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: "null"
        publicationYear:
          anyOf:
            - type: integer
              minimum: 1
              maximum: 9999
            - type: "null"
        language:
          type: string
          minLength: 1
          maxLength: 35
        edition:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: "null"
        category:
          type: string
          minLength: 1
          maxLength: 80
        isbn:
          anyOf:
            - type: string
              pattern: ^(?:[0-9]{9}[0-9X]|97[89][0-9]{10})$
            - type: "null"
      description: Trim text and count Unicode code points. ISBN may be null. Input normalization accepts
        ISBN separators/case and converts valid ISBN-10 to ISBN-13 before schema validation and
        hashing. ISBN-13 requires prefix 978 or 979 and a valid checksum; this does not verify
        assignment to a title. Metadata is immutable after confirmation. language is a BCP-47 tag
        canonicalized with Intl.getCanonicalLocales; malformed tags return field validation errors.
