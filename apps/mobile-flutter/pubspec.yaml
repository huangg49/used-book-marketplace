name: used_books_flutter
description: "Member application for the used-book marketplace."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  crypto: ^3.0.8
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  image_picker: ^1.2.4
  json_annotation: ^4.12.0

dev_dependencies:
  build_runner: ^2.7.1
  freezed: ^3.2.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/brand/lat-lai-horizontal-web.png
    - assets/brand/lat-lai-owl.png
    - assets/brand/lat-lai-wordmark.png
    - assets/brand/logo-original.png
    - assets/brand/lat-lai-horizontal-primary.png
    - assets/brand/lat-lai-horizontal-white.png
