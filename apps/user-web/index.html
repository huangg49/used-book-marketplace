<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Lật lại — Mua bán sách cũ</title>
    <meta
      name="description"
      content="Lật lại — mua bán và trao đổi sách cũ tại TP.HCM. Xem ảnh thực tế, tình trạng và giá của từng bản sách."
    />
    <script>
      // The SPA also serves this HTML for deep links. Only Home uses this image.
      if (window.location.pathname === '/') {
        const hero = document.createElement('link');
        hero.rel = 'preload';
        hero.as = 'image';
        hero.href = '/brand/hero-lettering.png';
        hero.fetchPriority = 'high';
        document.head.append(hero);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
