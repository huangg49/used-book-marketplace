<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 184 140" fill="none" stroke="#5c0202" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Exchange detail header crest: two hardcover books passing across a brass-sealed trade ribbon. Hand-authored for Lật lại. -->
  <ellipse cx="92" cy="128" rx="76" ry="6" fill="#5c0202" fill-opacity=".11" stroke="none"/>

  <!-- Soft archival trade ledger underneath -->
  <path d="M26 106h132l-8 16H34z" fill="#fbf4e8"/>
  <path d="M40 113h104" stroke="#b9814f" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Outgoing book (left, wine hardcover) -->
  <g transform="rotate(-11 54 74)">
    <rect x="26" y="42" width="54" height="68" rx="6" fill="#7c1a17"/>
    <path d="M35 42v68" stroke="#f4cb67" stroke-width="2.2"/>
    <rect x="43" y="54" width="28" height="18" rx="3" fill="#fffcf5"/>
    <path d="M48 61h18M48 66h12" stroke="#5c0202" stroke-width="2"/>
    <path d="M44 82h26M44 90h18" stroke="#f6e0a8" stroke-width="2"/>
    <!-- Page block edge -->
    <path d="M28 106h50" stroke="#fffcf5" stroke-width="3"/>
  </g>

  <!-- Incoming book (right, forest-emerald hardcover) -->
  <g transform="rotate(10 130 72)">
    <rect x="104" y="38" width="54" height="68" rx="6" fill="#254337"/>
    <path d="M113 38v68" stroke="#f4cb67" stroke-width="2.2"/>
    <rect x="121" y="50" width="28" height="18" rx="3" fill="#fffcf5"/>
    <path d="M126 57h18M126 62h13" stroke="#254337" stroke-width="2"/>
    <path d="M122 78h26M122 86h16" stroke="#b6dac5" stroke-width="2"/>
    <path d="M106 102h50" stroke="#fffcf5" stroke-width="3"/>
  </g>

  <!-- Exchange circulation arcs (gold + wine arrows) -->
  <path d="M56 26c18-13 54-13 72 0" stroke="#d9a441" stroke-width="3"/>
  <path d="M121 20l9 7-11 2" fill="#f4cb67" stroke="#5c0202" stroke-width="2.2"/>

  <path d="M128 112c-18 11-54 11-72 0" stroke="#5c0202" stroke-width="2.6"/>
  <path d="M63 118l-9-7 11-2" fill="#f4cb67" stroke="#5c0202" stroke-width="2.2"/>

  <!-- Central brass wax seal crest -->
  <g transform="translate(74 54)">
    <circle cx="18" cy="18" r="17" fill="#f4cb67"/>
    <circle cx="18" cy="18" r="12" fill="#fffcf5" stroke="#5c0202" stroke-width="1.8" stroke-dasharray="2.5 2.5"/>
    <path d="M12 15h11l-3-3M24 21H13l3 3" stroke="#5c0202" stroke-width="2.3"/>
  </g>

  <!-- Subtle sparkles -->
  <path d="M22 36l1.8 4.2 4.2 1.8-4.2 1.8-1.8 4.2-1.8-4.2-4.2-1.8 4.2-1.8z" fill="#f4cb67" stroke-width="1.8"/>
  <path d="M164 28l1.4 3.4 3.4 1.4-3.4 1.4-1.4 3.4-1.4-3.4-3.4-1.4 3.4-1.4z" fill="#f4cb67" stroke-width="1.8"/>
</svg>
