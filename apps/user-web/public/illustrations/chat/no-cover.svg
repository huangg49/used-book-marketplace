<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 88" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- No cover photo yet: a cloth-bound book with a blank, dashed label and a small picture mark. Hand-authored for Lật lại. -->
  <defs>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6ecda"/>
      <stop offset="1" stop-color="#e6d3b3"/>
    </linearGradient>
  </defs>
  <rect width="64" height="88" fill="url(#c)"/>
  <!-- spine band and corner -->
  <path d="M10 0v88" stroke="#5c0202" stroke-opacity=".14" stroke-width="8"/>
  <path d="M14 0v88" stroke="#5c0202" stroke-opacity=".22" stroke-width="1.2"/>
  <path d="M64 74l-12 14h12z" fill="#5c0202" fill-opacity=".1"/>
  <!-- blank label waiting for a photo -->
  <rect x="21" y="24" width="34" height="34" rx="4" fill="#fffcf5" stroke="#7c1a17" stroke-opacity=".45" stroke-width="1.4" stroke-dasharray="3 3"/>
  <circle cx="45" cy="33" r="3" fill="#f4cb67" stroke="#8a5f0c" stroke-opacity=".6" stroke-width="1"/>
  <path d="M25 53l8-9 6 6 4-4 8 7" stroke="#7c1a17" stroke-opacity=".55" stroke-width="1.6"/>
  <!-- title lines -->
  <path d="M23 66h28M27 72h20" stroke="#7c1a17" stroke-opacity=".3" stroke-width="2"/>
</svg>
