<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 88" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- Exchange card cover: two books trading places on a green ground, gold and cream arrows between. Hand-authored for Lật lại. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f8a69"/>
      <stop offset="1" stop-color="#1f3b30"/>
    </linearGradient>
  </defs>
  <rect width="64" height="88" fill="url(#g)"/>
  <path d="M0 70c18-6 40-6 64 2v16H0z" fill="#ffffff" fill-opacity=".06"/>
  <!-- book given (wine), upper left -->
  <g transform="rotate(-10 22 28)">
    <rect x="11" y="13" width="22" height="30" rx="2" fill="#8f2a22" stroke="#fffcf5" stroke-width="1.6"/>
    <path d="M15 13v30" stroke="#f4cb67" stroke-width="1.6"/>
    <path d="M19 21h10M19 25h7" stroke="#fffcf5" stroke-width="1.4"/>
  </g>
  <!-- book received (gold), lower right -->
  <g transform="rotate(9 42 60)">
    <rect x="31" y="45" width="22" height="30" rx="2" fill="#f4cb67" stroke="#fffcf5" stroke-width="1.6"/>
    <path d="M35 45v30" stroke="#8a5f0c" stroke-width="1.6"/>
    <path d="M39 53h10M39 57h7" stroke="#5c0202" stroke-width="1.4"/>
  </g>
  <!-- swap arrows -->
  <path d="M40 18c8 2 12 8 11 16" stroke="#f4cb67" stroke-width="2.4"/>
  <path d="M47 31l4 4 3-5" stroke="#f4cb67" stroke-width="2.4"/>
  <path d="M24 70c-8-2-12-8-11-16" stroke="#fffcf5" stroke-width="2.4"/>
  <path d="M17 57l-4-4-3 5" stroke="#fffcf5" stroke-width="2.4"/>
</svg>
