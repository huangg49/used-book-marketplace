<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" stroke="#5c0202" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Empty list: an open envelope waiting for its first letter, a book peeking out. Hand-authored for Lật lại. -->
  <ellipse cx="80" cy="112" rx="58" ry="5" fill="#5c0202" fill-opacity=".1" stroke="none"/>
  <!-- book rising out of the envelope -->
  <g transform="rotate(-6 80 46)">
    <rect x="56" y="18" width="48" height="60" rx="4" fill="#7c1a17"/>
    <path d="M64 18v60" stroke="#f4cb67" stroke-width="3"/>
    <path d="M72 34h22M72 42h14" stroke="#fffcf5" stroke-width="2.5"/>
  </g>
  <!-- envelope -->
  <path d="M24 56l56 34 56-34v46a6 6 0 0 1-6 6H30a6 6 0 0 1-6-6z" fill="#f6e0a8"/>
  <path d="M24 56l56-30 56 30" fill="none"/>
  <path d="M24 104l40-26M136 104l-40-26" stroke-width="2.5"/>
  <!-- dashed "first message" line -->
  <path d="M10 40h10M140 40h10" stroke-dasharray="2 5" stroke-width="2.5"/>
  <path d="M146 20l1.6 4 4 1.6-4 1.6-1.6 4-1.6-4-4-1.6 4-1.6z" fill="#f4cb67" stroke-width="2"/>
  <path d="M14 18l1.2 3 3 1.2-3 1.2-1.2 3-1.2-3-3-1.2 3-1.2z" fill="#fffcf5" stroke-width="2"/>
</svg>
