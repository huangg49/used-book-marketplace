<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="#5c0202" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
  <!-- Transactions header: two speech bubbles trading over an open book, with a price tag and swap arrows. Hand-authored for Lật lại. -->
  <ellipse cx="100" cy="150" rx="80" ry="6" fill="#5c0202" fill-opacity=".12" stroke="none"/>
  <!-- open book -->
  <path d="M30 118c22-8 46-8 70 2v26c-24-10-48-10-70-2z" fill="#fffcf5"/>
  <path d="M170 118c-22-8-46-8-70 2v26c24-10 48-10 70-2z" fill="#f6e0a8"/>
  <path d="M42 124c14-3 28-2 46 3M42 132c14-3 28-2 46 3" stroke-width="2"/>
  <path d="M112 127c18-5 32-6 46-3M112 135c18-5 32-6 46-3" stroke-width="2"/>
  <path d="M100 120v26" stroke-width="2.5"/>
  <!-- left bubble (buyer) -->
  <path d="M18 30h64a10 10 0 0 1 10 10v26a10 10 0 0 1-10 10H46l-14 12V76H18A10 10 0 0 1 8 66V40a10 10 0 0 1 10-10z" fill="#7c1a17"/>
  <path d="M24 46h40M24 58h26" stroke="#fffcf5" stroke-width="3"/>
  <!-- right bubble (seller), with a price tag -->
  <path d="M182 12h-60a10 10 0 0 0-10 10v28a10 10 0 0 0 10 10h34l14 12V60h12a10 10 0 0 0 10-10V22a10 10 0 0 0-10-10z" fill="#fffcf5"/>
  <g transform="rotate(-8 152 36)">
    <path d="M128 26h36l10 10-10 10h-36z" fill="#f4cb67"/>
    <circle cx="164" cy="36" r="2.5" fill="#5c0202" stroke="none"/>
    <path d="M136 36h18" stroke-width="2.5"/>
  </g>
  <!-- swap arrows between the bubbles -->
  <path d="M90 96c8-8 18-10 26-6" stroke="#b07a12" stroke-width="3"/>
  <path d="M112 84l5 6-7 3" stroke="#b07a12" stroke-width="3"/>
  <path d="M118 104c-8 8-18 10-26 6" stroke="#2e6b52" stroke-width="3"/>
  <path d="M96 116l-5-6 7-3" stroke="#2e6b52" stroke-width="3"/>
  <!-- sparkles -->
  <path d="M186 92l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f4cb67" stroke-width="2"/>
  <path d="M10 104l1.4 3.6L15 109l-3.6 1.4L10 114l-1.4-3.6L5 109l3.6-1.4z" fill="#fffcf5" stroke-width="2"/>
</svg>
