name: used-book-marketplace

services:
  # Primary database (ADR 0027). Single-node replica set with auth; the root
  # password comes from the root .env (pnpm setup:local generates it).
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/node.sh"]
    environment:
      MONGO_PORT: "27017"
      MONGO_REPLSET: rs-dev
      MONGO_ROOT_USER: latlai_root
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in .env (pnpm setup:local)}
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo:/scripts:ro
    healthcheck:
      test: ["CMD", "bash", "/scripts/health.sh"]
      interval: 3s
      timeout: 15s
      retries: 30

  # Legacy source for the one-time import (pnpm --filter @used-books/api
  # mongo:import-postgres). Kept under a profile; its volume is never removed.
  postgres:
    profiles: [legacy-postgres]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: usedbooks
      POSTGRES_USER: usedbooks
      POSTGRES_PASSWORD: usedbooks_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usedbooks -d usedbooks"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: [optional-redis]
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Legacy only. Current media uses Supabase Storage; keep existing volumes intact.
    profiles: [legacy-minio]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mailpit:
    profiles: [optional-mail]
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongo_data:
  postgres_data:
  redis_data:
  minio_data:
