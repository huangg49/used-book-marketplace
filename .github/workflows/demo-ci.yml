name: Demo scenario CI
on:
  pull_request:
    paths:
      [
        "scripts/demo/**",
        "scripts/demo-books.mjs",
        "scripts/demo-funding.mjs",
        "scripts/demo-orders.mjs",
        "scripts/test-demo-books.mjs",
        "scripts/test-demo-funding.mjs",
        "scripts/test-demo-orders.mjs",
        "scripts/test-demo-transit.mjs",
        "apps/api/**",
        "packages/api-contract/**",
        "package.json",
        "pnpm-lock.yaml",
        "infra/docker-compose.mongo-test.yml",
        "infra/mongo/**",
        ".github/workflows/demo-ci.yml",
      ]
  push:
    branches: [main]
    paths:
      [
        "scripts/demo/**",
        "scripts/demo-books.mjs",
        "scripts/demo-funding.mjs",
        "scripts/demo-orders.mjs",
        "scripts/test-demo-books.mjs",
        "scripts/test-demo-funding.mjs",
        "scripts/test-demo-orders.mjs",
        "scripts/test-demo-transit.mjs",
        "apps/api/**",
        "packages/api-contract/**",
        "package.json",
        "pnpm-lock.yaml",
        "infra/docker-compose.mongo-test.yml",
        "infra/mongo/**",
        ".github/workflows/demo-ci.yml",
      ]
jobs:
  demo:
    # MongoDB 8.0 requires a runner kernel older than 6.19 (SERVER-121912).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # These units use built-ins only. pnpm run on a fresh checkout may trigger
      # an implicit install before the explicit frozen-lockfile step below.
      - run: node --test scripts/demo/*.test.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @used-books/api exec oxlint $GITHUB_WORKSPACE/scripts/demo $GITHUB_WORKSPACE/scripts/demo-books.mjs $GITHUB_WORKSPACE/scripts/demo-funding.mjs $GITHUB_WORKSPACE/scripts/demo-orders.mjs $GITHUB_WORKSPACE/scripts/test-demo-books.mjs $GITHUB_WORKSPACE/scripts/test-demo-funding.mjs $GITHUB_WORKSPACE/scripts/test-demo-orders.mjs $GITHUB_WORKSPACE/scripts/test-demo-transit.mjs
      - run: docker compose -f infra/docker-compose.mongo-test.yml up -d --wait mongo-test
      - run: pnpm --filter @used-books/api build
      - run: pnpm test:demo:api
      - run: pnpm test:demo:funding
      - run: pnpm test:demo:orders
      - run: pnpm test:demo:transit
      - name: Mongo QA diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.mongo-test.yml ps -a
          docker compose -f infra/docker-compose.mongo-test.yml logs --no-color --tail=100
