name: API CI

on:
  pull_request:
    paths: ["apps/api/**", "packages/api-contract/**", "scripts/check-api-routes.mjs", "infra/docker-compose.mongo-test.yml", "infra/mongo/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/api-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/api-contract/**", "scripts/check-api-routes.mjs", "infra/docker-compose.mongo-test.yml", "infra/mongo/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/api-ci.yml"]

jobs:
  api:
    # MongoDB 8.0 cannot start on kernel 6.19+ (also present in new 24.04 images).
    # https://jira.mongodb.org/browse/SERVER-121912
    runs-on: ubuntu-22.04
    services:
      # Only the source of the one-time PostgreSQL -> MongoDB import test
      # (test/mongo/postgres-import.mongo-spec.ts). The API never connects to it.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: usedbooks
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: usedbooks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U usedbooks -d usedbooks_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      # QA-only replica sets from infra/docker-compose.mongo-test.yml.
      MONGO_TEST_URL: mongodb://latlai_qa_root:local_test_only@127.0.0.1:57017/latlai_ci_test?replicaSet=rs-test&authSource=admin
      MONGO_FAILOVER_URL: mongodb://127.0.0.1:57021,127.0.0.1:57022,127.0.0.1:57023/latlai_failover_test?replicaSet=rs-failover
      TEST_DATABASE_URL: postgresql://usedbooks:ci_only_password@localhost:5432/usedbooks_test
      JWT_ACCESS_SECRET: ci-only-signing-key-not-for-production-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: docker compose -f infra/docker-compose.mongo-test.yml --profile failover up -d --wait
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm contract:routes
      - run: pnpm --filter @used-books/api lint
      - run: pnpm --filter @used-books/api typecheck
      - run: pnpm --filter @used-books/api test
      - run: pnpm test:api:mongo
      - run: pnpm test:api:e2e
      - run: pnpm --filter @used-books/api build
      - name: Mongo QA diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.mongo-test.yml --profile failover ps -a
          docker compose -f infra/docker-compose.mongo-test.yml --profile failover logs --no-color --tail=100
