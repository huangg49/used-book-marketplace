name: Flutter CI

on:
  pull_request:
    paths: ["apps/mobile-flutter/**", "packages/api-contract/**"]
  push:
    branches: [main]
    paths: ["apps/mobile-flutter/**", "packages/api-contract/**"]

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile-flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Match the SDK verified by the current main until Flutter 3.50 is adopted.
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
