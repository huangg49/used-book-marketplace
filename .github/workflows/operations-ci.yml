name: Operations and public shelf CI
on:
  pull_request:
    paths: ["apps/admin-web/**", "apps/mobile-react-native/**", "apps/api/**", "packages/api-contract/**", "packages/session-client/**", "packages/brand/**", "scripts/test-public-shelf.mjs", "scripts/test-listing-journey.mjs", "scripts/test-address-journey.mjs", "infra/docker-compose.mongo-test.yml", "infra/mongo/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/operations-ci.yml"]
  push:
    branches: [main]
    paths: ["apps/admin-web/**", "apps/mobile-react-native/**", "apps/api/**", "packages/api-contract/**", "packages/session-client/**", "packages/brand/**", "scripts/test-public-shelf.mjs", "scripts/test-listing-journey.mjs", "scripts/test-address-journey.mjs", "infra/docker-compose.mongo-test.yml", "infra/mongo/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/operations-ci.yml"]
jobs:
  operations:
    runs-on: ubuntu-latest
    env:
      # Each browser run creates and drops its own *_test database on the QA replica set.
      MONGO_TEST_URL: mongodb://latlai_qa_root:local_test_only@127.0.0.1:57017/admin?replicaSet=rs-test&authSource=admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: docker compose -f infra/docker-compose.mongo-test.yml up -d --wait mongo-test
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      - run: pnpm --filter @used-books/api build
      - run: pnpm --filter @used-books/admin-web lint
      - run: pnpm --filter @used-books/admin-web typecheck
      - run: pnpm --filter @used-books/session-client test
      - run: pnpm --filter @used-books/admin-web test
      - run: pnpm --filter @used-books/admin-web build
      - run: pnpm --filter @used-books/admin-web exec playwright install --with-deps chromium
      - run: pnpm --filter @used-books/admin-web test:browser
      - run: pnpm --filter @used-books/mobile-react-native export:web
        env:
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:3009/api/v1
          EXPO_PUBLIC_DESIGN_PREVIEW: '1'
      - run: pnpm test:public:browser
      - name: Mongo QA diagnostics on failure
        if: failure()
        run: |
          docker compose -f infra/docker-compose.mongo-test.yml ps -a
          docker compose -f infra/docker-compose.mongo-test.yml logs --no-color --tail=100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: client-browser-evidence
          path: |
            apps/admin-web/test-results
            apps/mobile-react-native/test-results
