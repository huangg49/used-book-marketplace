name: Feature
description: Implement a reviewed product behavior
title: "[Feature] "
labels: [feature]
body:
  - type: input
    id: requirement
    attributes:
      label: Requirement IDs
      description: SRS, FR, or acceptance-criteria identifiers
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: Affected client/module, what is outside scope, existing API/design references and blocking tasks. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Owner and handoff
      description: Owner, intended branch/base, reviewer or unassigned, and any authorized push/PR/merge actions. Update test evidence and next action in the PR.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include invalid states, permissions, and duplicate requests where relevant.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options: [API, Flutter, React Native, Operations web, Infrastructure, Documentation]
    validations:
      required: true
